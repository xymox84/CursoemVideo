<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container {
            background-image: url(Imagens/target001.png);
            background-size: 100% 100%;
            position: relative;
            height: 500px;
            background-color: purple;
            padding: 10px;
        }

        #conteudo1 {
            background-image: url(Imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform:translate(-50%, -50%);
            height: 200px;
            width: 400px;
            background-color: yellow;
        }

        #conteudo2 {
            background-color: red;
            background-image: url(Imagens/target001.png);
            background-size: 100% 100%;
            position: absolute;
            left: 25%;
            top: 25%;
            height: 100px;
            width: 200px;

        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo1">
            <aside id="conteudo2"></aside>
        </article>
    </section>
</body>
</html>
