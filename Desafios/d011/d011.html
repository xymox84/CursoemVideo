<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 011 Astronauta</title>
    <style>
        * {
            margin: 0px;
            padding: 0%;
        }

        body {
            background-color: black;
            /* height: 98vh; */
        }
        .fundo {
            height: 100vh;
            background: black url(Imagens/espaco.jpg) center center no-repeat fixed;
            background-image: url(Imagens/espaco.jpg);
            background-size: cover;
            position: relative;
        }

        .dentro {
            background-image: url(Imagens/astronauta.png);
            background-position: center center;
            position: absolute;
            /* background-size: 100% 100%; */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 500px;
            width: 500px;
        }
        .dentro:hover {
            zoom: 120%;

        }
    </style>
</head>
<body>
<div class="fundo">
    <div class="dentro"></div>
</div>
</body>
</html>
